<!DOCTYPE html>
<!-- saved from url=(0031)https://www.thirdangle.io/tuner -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drone Tuner</title>
<link href="./Drone Tuner_files/css2" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0c0a; --border: #3a2e1e;
    --amber: #e8a030; --amber-dim: #7a4f10; --amber-glow: rgba(232,160,48,0.25);
    --red: #e83828; --red-glow: rgba(232,56,40,0.3);
    --green: #4ae830; --green-glow: rgba(74,232,48,0.3);
    --text: #c8a878; --text-dim: #5a4830;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Share Tech Mono','Courier New',monospace;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background-image: radial-gradient(ellipse at 20% 30%,rgba(60,40,10,0.4) 0%,transparent 60%),
      radial-gradient(ellipse at 80% 70%,rgba(40,20,5,0.3) 0%,transparent 60%);
  }
  .device {
    background: linear-gradient(160deg,#1e1a14,#111008);
    border: 1.5px solid var(--border); border-radius: 12px; padding: 28px 24px 32px;
    width: 100%; max-width: 560px;
    box-shadow: 0 0 0 1px #0a0806, 0 8px 40px rgba(0,0,0,0.8),
      inset 0 1px 0 rgba(255,255,255,0.04), inset 0 0 80px rgba(0,0,0,0.4);
    position: relative;
  }
  .screw {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%,#3a3020,#1a1510);
    border: 1px solid #2a2218; box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
  }
  .screw::after { content:''; position:absolute; top:50%; left:20%; right:20%; height:1px; background:rgba(0,0,0,0.6); transform:translateY(-50%); }
  .screw.tl{top:12px;left:12px} .screw.tr{top:12px;right:12px}
  .screw.bl{bottom:12px;left:12px} .screw.br{bottom:12px;right:12px}

  .header { text-align: center; margin-bottom: 28px; }
  .brand { font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:.35em; color:var(--text-dim); margin-bottom:4px; }
  .title { font-family:'Bebas Neue',sans-serif; font-size:42px; letter-spacing:.12em; color:var(--amber); text-shadow:0 0 20px var(--amber-glow),0 0 40px rgba(232,160,48,0.1); line-height:1; }
  .subtitle { font-size:9px; letter-spacing:.25em; color:var(--text-dim); margin-top:2px; }

  .display {
    background:#080705; border:1px solid #2a2010; border-radius:4px;
    padding:10px 16px; margin-bottom:20px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:inset 0 2px 8px rgba(0,0,0,0.6);
  }
  .display-label { font-size:9px; letter-spacing:.2em; color:var(--text-dim); }
  .display-note { font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:.1em; color:var(--amber); text-shadow:0 0 12px var(--amber-glow); transition:all .15s; min-width:60px; text-align:center; }
  .display-note.active { color:var(--green); text-shadow:0 0 16px var(--green-glow),0 0 30px rgba(74,232,48,0.15); }
  .display-freq { font-size:11px; color:var(--text-dim); text-align:right; }
  .display-freq span { display:block; color:var(--text); font-size:14px; }
  .led { width:8px; height:8px; border-radius:50%; background:#1a0a08; border:1px solid #2a1510; box-shadow:none; transition:all .1s; flex-shrink:0; }
  .led.on { background:var(--red); border-color:#ff6040; box-shadow:0 0 6px var(--red-glow),0 0 12px rgba(232,56,40,0.4); }

  .section-label { font-size:9px; letter-spacing:.3em; color:var(--text-dim); margin-bottom:10px; padding-left:2px; display:flex; align-items:center; gap:10px; }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

  .button-row { display:grid; gap:8px; margin-bottom:12px; }

  .drone-btn {
    position:relative; background:linear-gradient(180deg,#242018,#181410);
    border:1.5px solid #3a2e1e; border-radius:6px; padding:0; cursor:pointer;
    transition:all .08s; overflow:hidden;
    box-shadow:0 3px 6px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.04),inset 0 -2px 4px rgba(0,0,0,0.3);
    width:100%; min-height:64px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .drone-btn:hover { border-color:var(--amber-dim); background:linear-gradient(180deg,#2a2418,#1c1810); }
  .drone-btn:active { transform:translateY(1px); }
  .drone-btn.playing { border-color:var(--amber); background:linear-gradient(180deg,#2e2410,#1e180a); box-shadow:0 0 0 1px rgba(232,160,48,0.3),0 0 16px rgba(232,160,48,0.2),0 3px 6px rgba(0,0,0,0.5),inset 0 1px 0 rgba(232,160,48,0.1); }
  .btn-note { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:.05em; color:var(--text-dim); transition:all .1s; line-height:1; }
  .drone-btn:hover .btn-note { color:var(--text); }
  .drone-btn.playing .btn-note { color:var(--amber); text-shadow:0 0 10px var(--amber-glow); }
  .btn-freq { font-size:9px; color:#3a3020; transition:color .1s; }
  .drone-btn:hover .btn-freq { color:var(--text-dim); }
  .drone-btn.playing .btn-freq { color:var(--amber-dim); }
  .ripple { position:absolute; border-radius:50%; background:rgba(232,160,48,0.15); transform:scale(0); animation:ripple .4s ease-out forwards; pointer-events:none; }
  @keyframes ripple { to { transform:scale(3); opacity:0; } }

  .wave-container { margin-bottom:20px; height:40px; background:#080705; border:1px solid #1e1a10; border-radius:4px; overflow:hidden; }
  canvas#waveCanvas { width:100%; height:100%; display:block; }

  .volume-section { display:flex; align-items:center; gap:16px; margin-top:4px; }
  .vol-label { font-size:9px; letter-spacing:.25em; color:var(--text-dim); flex-shrink:0; width:48px; }
  .vol-value { font-size:11px; color:var(--amber); flex-shrink:0; width:36px; text-align:right; }
  input[type="range"] { -webkit-appearance:none; flex:1; height:4px; background:#1e1a10; border-radius:2px; outline:none; border:1px solid #2a2418; box-shadow:inset 0 1px 3px rgba(0,0,0,0.5); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#d09028,#7a5010); border:1px solid var(--amber-dim); box-shadow:0 0 6px rgba(232,160,48,0.3),0 2px 4px rgba(0,0,0,0.5); cursor:pointer; }
  input[type="range"]::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#d09028,#7a5010); border:1px solid var(--amber-dim); cursor:pointer; }

  .divider { height:1px; background:linear-gradient(90deg,transparent,var(--border),transparent); margin:20px 0; }

  /* ── BASS MODE TOGGLE ── */
  .mode-toggle { display:flex; gap:6px; margin-bottom:12px; }
  .mode-btn, .guitar-mode-btn {
    flex:1; padding:7px 4px; font-family:'Share Tech Mono',monospace;
    font-size:9px; letter-spacing:.15em; color:var(--text-dim);
    background:linear-gradient(180deg,#1c1810,#141008);
    border:1.5px solid #2a2010; border-radius:5px; cursor:pointer;
    transition:all .1s; text-align:center;
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.4);
  }
  .mode-btn:hover, .guitar-mode-btn:hover { border-color:var(--amber-dim); color:var(--text); }
  .mode-btn.active, .guitar-mode-btn.active {
    background:linear-gradient(180deg,#2a2010,#1a1408);
    border-color:var(--amber); color:var(--amber);
    box-shadow:0 0 8px rgba(232,160,48,0.15),inset 0 1px 3px rgba(0,0,0,0.3);
  }


</style>
</head>
<body>
<div class="device">
  <div class="screw tl"></div><div class="screw tr"></div>
  <div class="screw bl"></div><div class="screw br"></div>

  <div class="header">
    <div class="brand">UNIT — 01</div>
    <div class="title">DRONE TUNER</div>
    <div class="subtitle">CONTINUOUS REFERENCE TONE GENERATOR</div>
  </div>

  <div class="display">
    <div class="display-label">DRONE</div>
    <div class="display-note" id="displayNote">—</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="display-freq"><div style="font-size:9px;color:var(--text-dim)">Hz</div><span id="displayFreq">—</span></div>
      <div class="led" id="led"></div>
    </div>
  </div>

  <div class="wave-container"><canvas id="waveCanvas" width="507" height="38"></canvas></div>

  <div class="section-label">BASS GUITAR</div>
  <div class="mode-toggle">
    <button class="mode-btn" data-mode="4std">4-STRING</button>
    <button class="mode-btn" data-mode="drop">DROP D</button>
    <button class="mode-btn active" data-mode="5std">5-STRING</button>
  </div>
  <div class="button-row" id="bassRow" style="grid-template-columns: repeat(5, 1fr);"><button class="drone-btn" data-note="B" data-oct="0" data-active=""><div class="btn-note">B</div><div class="btn-freq">30.9</div></button><button class="drone-btn" data-note="E" data-oct="1" data-active=""><div class="btn-note">E</div><div class="btn-freq">41.2</div></button><button class="drone-btn" data-note="A" data-oct="1" data-active=""><div class="btn-note">A</div><div class="btn-freq">55.0</div></button><button class="drone-btn" data-note="D" data-oct="2" data-active=""><div class="btn-note">D</div><div class="btn-freq">73.4</div></button><button class="drone-btn" data-note="G" data-oct="2" data-active=""><div class="btn-note">G</div><div class="btn-freq">98.0</div></button></div>
  <div class="divider"></div>
  <div class="section-label">GUITAR</div>
  <div class="mode-toggle">
    <button class="guitar-mode-btn active" data-gmode="6std">6-STRING</button>
    <button class="guitar-mode-btn" data-gmode="drop">DROP D</button>
    <button class="guitar-mode-btn" data-gmode="7std">7-STRING</button>
  </div>
  <div class="button-row guitar-row" id="guitarRow" style="grid-template-columns: repeat(6, 1fr);"><button class="drone-btn" data-note="E" data-oct="2" data-active=""><div class="btn-note">E</div><div class="btn-freq">82.4</div></button><button class="drone-btn" data-note="A" data-oct="2" data-active=""><div class="btn-note">A</div><div class="btn-freq">110.0</div></button><button class="drone-btn" data-note="D" data-oct="3" data-active=""><div class="btn-note">D</div><div class="btn-freq">146.8</div></button><button class="drone-btn" data-note="G" data-oct="3" data-active=""><div class="btn-note">G</div><div class="btn-freq">196.0</div></button><button class="drone-btn" data-note="B" data-oct="3" data-active=""><div class="btn-note">B</div><div class="btn-freq">246.9</div></button><button class="drone-btn" data-note="E" data-oct="4" data-active=""><div class="btn-note">E</div><div class="btn-freq">329.6</div></button></div>
  <div class="divider"></div>

  <div class="section-label">VOLUME</div>
  <div class="volume-section">
    <div class="vol-label">LEVEL</div>
    <input type="range" id="volumeSlider" min="0" max="100" value="70">
    <div class="vol-value" id="volDisplay">77</div>
  </div>


</div>

<script>
// ═══════════════════════════════════════
//  DRONE ENGINE
// ═══════════════════════════════════════
function makeWavURL(freq, amp) {
  const SR=44100, numSamples=Math.round(SR/freq)*Math.round(20*freq);
  const buf=new ArrayBuffer(44+numSamples*2), d=new DataView(buf);
  const ws=(o,v)=>{for(let i=0;i<v.length;i++)d.setUint8(o+i,v.charCodeAt(i));};
  ws(0,'RIFF'); d.setUint32(4,36+numSamples*2,true); ws(8,'WAVE'); ws(12,'fmt ');
  d.setUint32(16,16,true); d.setUint16(20,1,true); d.setUint16(22,1,true);
  d.setUint32(24,SR,true); d.setUint32(28,SR*2,true); d.setUint16(32,2,true); d.setUint16(34,16,true);
  ws(36,'data'); d.setUint32(40,numSamples*2,true);
  for(let i=0;i<numSamples;i++) d.setInt16(44+i*2,Math.round(((i*freq/SR)%1.0*2-1)*amp*32767),true);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}

const BASS_MODES = {
  '4std': [{name:'E',octave:'1',freq:41.20},{name:'A',octave:'1',freq:55.00},{name:'D',octave:'2',freq:73.42},{name:'G',octave:'2',freq:98.00}],
  'drop':  [{name:'D',octave:'1',freq:36.71},{name:'A',octave:'1',freq:55.00},{name:'D',octave:'2',freq:73.42},{name:'G',octave:'2',freq:98.00}],
  '5std': [{name:'B',octave:'0',freq:30.87},{name:'E',octave:'1',freq:41.20},{name:'A',octave:'1',freq:55.00},{name:'D',octave:'2',freq:73.42},{name:'G',octave:'2',freq:98.00}],
};
const GUITAR_MODES = {
  '6std': [{name:'E',octave:'2',freq:82.41},{name:'A',octave:'2',freq:110.00},{name:'D',octave:'3',freq:146.83},{name:'G',octave:'3',freq:196.00},{name:'B',octave:'3',freq:246.94},{name:'E',octave:'4',freq:329.63}],
  'drop':  [{name:'D',octave:'2',freq:73.42},{name:'A',octave:'2',freq:110.00},{name:'D',octave:'3',freq:146.83},{name:'G',octave:'3',freq:196.00},{name:'B',octave:'3',freq:246.94},{name:'E',octave:'4',freq:329.63}],
  '7std': [{name:'B',octave:'1',freq:61.74},{name:'E',octave:'2',freq:82.41},{name:'A',octave:'2',freq:110.00},{name:'D',octave:'3',freq:146.83},{name:'G',octave:'3',freq:196.00},{name:'B',octave:'3',freq:246.94},{name:'E',octave:'4',freq:329.63}],
};

// WAV cache — generated on first click, not at load time
// iOS ignores HTMLMediaElement.volume, so volume is baked into the WAV amplitude instead.
// Cache holds files for the current slider level only; it is flushed when the level changes.
const wavCache = new Map();
function volToAmp(v){ const x=v/100; return 0.5*x*x; }   // quadratic taper, 70 ~ old loudness
function getWavURL(freq){
  if(!wavCache.has(freq)) wavCache.set(freq, makeWavURL(freq, volToAmp(+slider.value)));
  return wavCache.get(freq);
}

let currentAudio=null, currentNote=null, activeDroneBtn=null, droneRaf=null, wavePhase=0;
const elDNote=document.getElementById('displayNote'), elDFreq=document.getElementById('displayFreq');
const elLed=document.getElementById('led'), slider=document.getElementById('volumeSlider'), elVol=document.getElementById('volDisplay');
const wCvs=document.getElementById('waveCanvas'), wCtx=wCvs.getContext('2d');
const bassRow=document.getElementById('bassRow');

function stopDrone(){ if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null;} currentNote=null; if(droneRaf){cancelAnimationFrame(droneRaf);droneRaf=null;} }

function droneUI(btn,note){
  document.querySelectorAll('.drone-btn').forEach(b=>{b.classList.remove('playing');b.dataset.active='';});
  if(!btn){ elDNote.textContent='—';elDNote.classList.remove('active');elDFreq.textContent='—';elLed.classList.remove('on');clearDroneWave();return; }
  btn.classList.add('playing');btn.dataset.active='yes';
  elDNote.textContent=note.name+note.octave;elDNote.classList.add('active');
  elDFreq.textContent=note.freq.toFixed(2);elLed.classList.add('on');
  animDroneWave(note.freq);
}

function handleDrone(note,btn){
  const stop=btn.dataset.active==='yes'; stopDrone(); activeDroneBtn=null;
  if(stop){droneUI(null,null);return;}
  const url=getWavURL(note.freq);  // generate lazily on first click
  const a=new Audio(url); a.loop=true;
  a.play().catch(e=>console.warn(e));
  currentAudio=a; currentNote=note; activeDroneBtn=btn; droneUI(btn,note);
}

function clearDroneWave(){ wCvs.width=wCvs.offsetWidth||480; wCvs.height=wCvs.offsetHeight||40; wCtx.fillStyle='#080705'; wCtx.fillRect(0,0,wCvs.width,wCvs.height); }

function animDroneWave(freq){
  wCvs.width=wCvs.offsetWidth||480; wCvs.height=wCvs.offsetHeight||40;
  const W=wCvs.width,H=wCvs.height,spd=freq/200;
  (function loop(){ droneRaf=requestAnimationFrame(loop); wavePhase+=spd;
    wCtx.fillStyle='#080705';wCtx.fillRect(0,0,W,H);
    wCtx.beginPath();wCtx.strokeStyle='rgba(232,160,48,0.8)';wCtx.lineWidth=1.5;wCtx.shadowColor='rgba(232,160,48,0.4)';wCtx.shadowBlur=6;
    for(let x=0;x<W;x++){const y=H/2+Math.sin(x/W*Math.PI*6+wavePhase)*(H/2-4);x===0?wCtx.moveTo(x,y):wCtx.lineTo(x,y);}
    wCtx.stroke();
  })();
}

function makeDroneBtn(note,container){
  const btn=document.createElement('button');
  btn.className='drone-btn';btn.dataset.note=note.name;btn.dataset.oct=note.octave;
  btn.innerHTML=`<div class="btn-note">${note.name}</div><div class="btn-freq">${note.freq.toFixed(1)}</div>`;
  btn.addEventListener('click',e=>{
    const r=document.createElement('span');r.className='ripple';
    const rect=btn.getBoundingClientRect(),sz=Math.max(rect.width,rect.height);
    r.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX-rect.left-sz/2}px;top:${e.clientY-rect.top-sz/2}px`;
    btn.appendChild(r);setTimeout(()=>r.remove(),500);
    handleDrone(note,btn);
  });
  container.appendChild(btn);
}

const guitarRow=document.getElementById('guitarRow');

function buildBassRow(mode){
  stopDrone(); droneUI(null,null);
  bassRow.innerHTML='';
  const notes=BASS_MODES[mode];
  bassRow.style.gridTemplateColumns=`repeat(${notes.length},1fr)`;
  notes.forEach(n=>makeDroneBtn(n,bassRow));
}

function buildGuitarRow(mode){
  stopDrone(); droneUI(null,null);
  guitarRow.innerHTML='';
  const notes=GUITAR_MODES[mode];
  guitarRow.style.gridTemplateColumns=`repeat(${notes.length},1fr)`;
  notes.forEach(n=>makeDroneBtn(n,guitarRow));
}

// Bass toggle
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    buildBassRow(btn.dataset.mode);
  });
});

// Guitar toggle
document.querySelectorAll('.guitar-mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.guitar-mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    buildGuitarRow(btn.dataset.gmode);
  });
});

buildBassRow('4std');
buildGuitarRow('6std');
let volTimer=null;
function applyVolume(){
  volTimer=null;
  const old=[...wavCache.values()];
  wavCache.clear();                       // levels changed: old files are stale
  if(currentAudio && currentNote){
    const a=currentAudio, t=a.currentTime, wasPlaying=!a.paused;
    a.src=getWavURL(currentNote.freq);
    a.loop=true;
    // identical file lengths, so resuming at the same time keeps the waveform phase (no click)
    a.addEventListener('loadedmetadata',()=>{ try{a.currentTime=t;}catch(e){} if(wasPlaying)a.play().catch(()=>{}); },{once:true});
    a.load();
  }
  setTimeout(()=>old.forEach(u=>URL.revokeObjectURL(u)),1500);
}
function updateVolume(){
  elVol.textContent=slider.value;
  clearTimeout(volTimer);
  volTimer=setTimeout(applyVolume,120);   // debounce while dragging
}
slider.addEventListener('input', updateVolume);
slider.addEventListener('change', updateVolume);
clearDroneWave();



</script>


</body></html>
